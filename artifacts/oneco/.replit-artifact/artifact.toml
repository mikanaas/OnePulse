kind = "web"
previewPath = "/"
title = "OneCo Porteføljeverktøy"
version = "1.0.0"
id = "artifacts/oneco"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20505

[services.development]
run = "pnpm --filter @workspace/oneco run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oneco", "run", "build" ]
publicDir = "artifacts/oneco/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20505"
BASE_PATH = "/"
