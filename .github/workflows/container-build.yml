name: Container build

on:
  pull_request:
  push:
    branches:
      - main
      - appfactory/azure-container-entra

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OnePulse container
        run: docker build --tag onepulse:${{ github.sha }} .
